    <script>
      // Applies the stored / system theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('gs-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          var stored_lang = localStorage.getItem('gs-lang');
          root.lang = (stored_lang === 'en' || (!stored_lang && !(navigator.language || '').toLowerCase().startsWith('pt'))) ? 'en' : 'pt-BR';
        } catch (e) { /* keep the markup defaults */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
